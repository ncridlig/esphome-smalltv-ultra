esphome:
  name: geekmagic
  friendly_name: Mini Display Clock

esp8266:
  board: esp01_1m

logger:

api:

web_server:
  port: 80

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  ap:
    ssid: "Mini-Display-Tv"
    password: "12345678"

captive_portal:

spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13
  interface: hardware
  id: spihwd

output:
  - platform: esp8266_pwm
    pin: GPIO05
    frequency: 200 Hz
    inverted: true
    id: backlight_pwm

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Backlight"
    id: backlight
    restore_mode: RESTORE_AND_ON

font:
  - file: "gfonts://Orbitron"
    id: clock_font
    size: 100
  - file: "gfonts://Stack+Sans+Notch"
    id: rain_font
    size: 14

time:
  - platform: sntp
    id: ntp_time
    timezone: Europe/Rome  # Bologna, Italy

# ── Home Assistant controls ──────────────────────────────────────────────────
#   switch.night_mode  → DAY (off) / NIGHT (on)
#   select.weather     → Auto / Clear / Rain / Cloudy / Windy
# ────────────────────────────────────────────────────────────────────────────

switch:
  - platform: template
    name: "Night Mode"
    id: night_switch
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: return id(is_night);
    turn_on_action:
      - lambda: id(is_night) = true;
    turn_off_action:
      - lambda: id(is_night) = false;

select:
  - platform: template
    name: "Weather"
    id: weather_select
    options:
      - "Auto"
      - "Clear"
      - "Rain"
      - "Cloudy"
      - "Windy"
    initial_option: "Auto"
    restore_value: true
    set_action:
      - lambda: |-
          if      (x == "Rain")   id(weather_mode) = 1;
          else if (x == "Cloudy") id(weather_mode) = 2;
          else if (x == "Windy")  id(weather_mode) = 3;
          else                    id(weather_mode) = 0;  // Clear or Auto

# Pulls live weather state from Home Assistant.
# Change entity_id to match your weather integration (e.g. weather.openweathermap).
text_sensor:
  - platform: homeassistant
    id: ha_weather
    entity_id: weather.home
    on_value:
      then:
        - lambda: |-
            if (id(weather_select).state != "Auto") return;
            if (x.find("rain")      != std::string::npos ||
                x.find("lightning") != std::string::npos ||
                x.find("pour")      != std::string::npos ||
                x.find("drizzle")   != std::string::npos) {
              id(weather_mode) = 1;
            } else if (x.find("cloud")   != std::string::npos ||
                       x.find("fog")     != std::string::npos ||
                       x.find("snow")    != std::string::npos ||
                       x.find("hail")    != std::string::npos ||
                       x == "overcast") {
              id(weather_mode) = 2;
            } else if (x.find("wind") != std::string::npos) {
              id(weather_mode) = 3;
            } else {
              id(weather_mode) = 0;  // sunny, clear, partlycloudy → Clear
            }

globals:
  # ── Mode state ──────────────────────────────────────────────────────────
  - id: is_night
    type: bool
    restore_value: yes
    initial_value: 'false'

  # 0 = CLEAR  1 = RAIN  2 = CLOUDY  3 = WINDY
  - id: weather_mode
    type: int
    restore_value: yes
    initial_value: '0'

  # ── Animation counter ────────────────────────────────────────────────────
  - id: anim_frame
    type: int
    restore_value: no
    initial_value: '0'

  # Lightning state (rain mode)
  - id: lightning_timer
    type: int
    restore_value: no
    initial_value: '0'
  - id: lightning_x
    type: int
    restore_value: no
    initial_value: '100'

  # Shooting star (clear night)
  - id: star_x
    type: int
    restore_value: no
    initial_value: '-30'
  - id: star_y
    type: int
    restore_value: no
    initial_value: '-20'

  # Burn-in pixel shift
  - id: x_shift
    type: int
    restore_value: no
    initial_value: '0'
  - id: y_shift
    type: int
    restore_value: no
    initial_value: '0'

  # Raindrop X positions
  - id: drop_x1
    type: int
    restore_value: no
    initial_value: '10'
  - id: drop_x2
    type: int
    restore_value: no
    initial_value: '50'
  - id: drop_x3
    type: int
    restore_value: no
    initial_value: '90'
  - id: drop_x4
    type: int
    restore_value: no
    initial_value: '130'
  - id: drop_x5
    type: int
    restore_value: no
    initial_value: '170'
  - id: drop_x6
    type: int
    restore_value: no
    initial_value: '210'
  - id: drop_x7
    type: int
    restore_value: no
    initial_value: '30'
  - id: drop_x8
    type: int
    restore_value: no
    initial_value: '70'
  - id: drop_x9
    type: int
    restore_value: no
    initial_value: '110'
  - id: drop_x10
    type: int
    restore_value: no
    initial_value: '150'

  # Raindrop Y positions
  - id: drop_y1
    type: int
    restore_value: no
    initial_value: '0'
  - id: drop_y2
    type: int
    restore_value: no
    initial_value: '30'
  - id: drop_y3
    type: int
    restore_value: no
    initial_value: '60'
  - id: drop_y4
    type: int
    restore_value: no
    initial_value: '90'
  - id: drop_y5
    type: int
    restore_value: no
    initial_value: '120'
  - id: drop_y6
    type: int
    restore_value: no
    initial_value: '150'
  - id: drop_y7
    type: int
    restore_value: no
    initial_value: '180'
  - id: drop_y8
    type: int
    restore_value: no
    initial_value: '210'
  - id: drop_y9
    type: int
    restore_value: no
    initial_value: '60'
  - id: drop_y10
    type: int
    restore_value: no
    initial_value: '120'

interval:
  - interval: 60s
    then:
      - lambda: |-
          id(x_shift) = (id(x_shift) + 1) % 5;
          id(y_shift) = (id(y_shift) + 1) % 5;

display:
  - platform: mipi_spi
    model: st7789v
    spi_id: spihwd
    dimensions:
      width: 240
      height: 240
    invert_colors: true
    dc_pin: GPIO00
    reset_pin: GPIO02
    color_depth: 8
    update_interval: 50ms
    id: disp
    spi_mode: mode3

    lambda: |-
      id(anim_frame) += 1;
      int f  = id(anim_frame);
      int wm = id(weather_mode);   // 0=CLEAR 1=RAIN 2=CLOUDY 3=WINDY
      bool night = id(is_night);

      // ── Helios arc position ─────────────────────────────────────────────
      // Crosses sky in 1500 frames (~75 s). hx: -60 → 299.
      int hx = (f % 1500) * 360 / 1500 - 60;
      // Parabolic arc: peaks at y=35 (center), sinks to ~y=131 at screen edges.
      int hy = 35 + (hx - 120) * (hx - 120) / 150;
      bool helios_on_screen = (!night) && (hx > -65) && (hx < 305);

      // ── Background ──────────────────────────────────────────────────────
      if      (night && wm == 0) it.fill(Color(0,   0,  20));   // clear night
      else if (wm == 1)          it.fill(Color(20,  25,  45));  // stormy
      else if (wm == 2)          it.fill(Color(100,110, 125));  // overcast
      else if (wm == 3)          it.fill(Color(140,195, 230));  // breezy
      else                       it.fill(Color(80, 155, 220));  // clear day

      // ════════════════════════════════════════════════════════════════════
      // CLEAR NIGHT — stars, crescent moon, shooting star
      // ════════════════════════════════════════════════════════════════════
      if (night && wm == 0) {
        static const uint8_t SX[] = {12,42,78,115,158,192,218,28,62,98,138,178,208,22,72,165,5,105,230,52};
        static const uint8_t SY[] = {18,48,12, 32, 22,  8, 42,78,68,88, 58, 72, 28,108,98, 55,62,140,110,130};
        for (int i = 0; i < 20; i++)
          it.filled_rectangle(SX[i], SY[i], 2, 2, Color::WHITE);

        it.filled_circle(38, 38, 28, Color(255, 252, 180));
        it.filled_circle(52, 28, 23, Color(0, 0, 20));

        id(star_x) += 3;  id(star_y) += 2;
        if (id(star_x) > 280 || id(star_y) > 260) {
          if (random(0,2)==0) { id(star_x)=random(-60,40);  id(star_y)=random(-30,-5); }
          else                { id(star_x)=random(-80,-10); id(star_y)=random(-20,80); }
        }
        for (int t = 0; t < 8; t++) {
          int tx = id(star_x)-t*3, ty = id(star_y)-t*2;
          if (tx>=0&&tx<240&&ty>=0&&ty<240) {
            uint8_t b = (uint8_t)(255 - t*28);
            it.filled_rectangle(tx, ty, 2, 2, Color(b, b, (uint8_t)(b/4)));
          }
        }

      // ════════════════════════════════════════════════════════════════════
      // ALL OTHER MODES — Helios + weather effects
      // ════════════════════════════════════════════════════════════════════
      } else {

        // ── Helios position (WINDY wobble applied) ──────────────────────
        int dhx = hx;
        int dhy = hy;
        if (wm == 3 && helios_on_screen) {
          dhy += (int)(sinf(f * 0.08f) * 14.0f);
          dhx += (int)(sinf(f * 0.13f) *  9.0f);
        }

        // ── Draw Helios (sun, crown, chariot, horses) ───────────────────
        if (helios_on_screen) {
          bool dim = (wm == 2);
          // Palette
          Color c_out  = dim ? Color(160,108,14) : Color(255,145,20);  // sun outer
          Color c_mid  = dim ? Color(178,148,44) : Color(255,205,55);  // sun mid
          Color c_pale = dim ? Color(193,178,108): Color(255,248,175); // sun pale
          Color c_ray  = dim ? Color(172,138,28) : Color(255,200,40);  // crown rays
          Color c_gold = Color(220,180,40);   // chariot gold trim
          Color c_spk  = Color(185,145,30);   // wheel spokes
          Color c_hrse = Color(245,238,215);  // horse cream
          Color c_mane = Color(210,185,95);   // golden mane
          Color c_rein = Color(195,165,85);   // reins
          Color c_skin = Color(255,215,160);  // face skin
          Color c_chk  = Color(255,150,138);  // rosy cheeks
          Color c_eye  = Color(68,44,20);     // eye/line detail

          // ── Sun disc (layered glow: orange → gold → pale → white core) ──
          it.filled_circle(dhx, dhy, 22, c_out);
          it.filled_circle(dhx, dhy, 16, c_mid);
          it.filled_circle(dhx, dhy, 10, c_pale);
          it.filled_circle(dhx, dhy,  4, Color(255,255,255));

          // ── Crown rays: long at cardinals (0°,90°…), short at diagonals ─
          for (int r = 0; r < 8; r++) {
            float a = r * 0.7854f;
            int outer = (r % 2 == 0) ? 38 : 30;
            it.line(dhx+(int)(cosf(a)*23.f), dhy+(int)(sinf(a)*23.f),
                    dhx+(int)(cosf(a)*(float)outer), dhy+(int)(sinf(a)*(float)outer),
                    c_ray);
          }

          // ── Helios face: zen expression on the sun disc ──────────────────
          it.filled_circle(dhx, dhy, 9, c_skin);
          // Closed peaceful eyes (∧ arcs)
          it.line(dhx-5, dhy-1, dhx-3, dhy-3, c_eye);
          it.line(dhx-3, dhy-3, dhx-1, dhy-1, c_eye);
          it.line(dhx+1, dhy-1, dhx+3, dhy-3, c_eye);
          it.line(dhx+3, dhy-3, dhx+5, dhy-1, c_eye);
          // Gentle smile
          it.line(dhx-3, dhy+3, dhx,   dhy+5, c_eye);
          it.line(dhx,   dhy+5, dhx+3, dhy+3, c_eye);
          // Rosy cheeks
          it.filled_circle(dhx-5, dhy+1, 2, c_chk);
          it.filled_circle(dhx+5, dhy+1, 2, c_chk);

          // ── Chariot body (crimson lacquer, gold-trimmed) ─────────────────
          int cbx = dhx - 22;
          int cby = dhy + 26;
          it.filled_rectangle(cbx,    cby,    44, 14, Color(148,22,22)); // crimson
          it.filled_rectangle(cbx,    cby-2,  44,  3, c_gold);  // top trim
          it.filled_rectangle(cbx,    cby+14, 44,  2, c_gold);  // bottom trim
          it.line(cbx,    cby-2, cbx,    cby+16, c_gold);       // left edge
          it.line(cbx+43, cby-2, cbx+43, cby+16, c_gold);       // right edge
          it.circle(cbx+43, cby+7, 5, c_gold);                  // ornate front boss

          // ── Wheels: 6-spoke gold (frame-animated rotation) ───────────────
          int wly = cby + 15;
          float wrot = f * 0.12f;  // wheel rotation angle
          int wlx = dhx - 18;
          it.circle(wlx, wly, 10, c_gold);
          it.filled_circle(wlx, wly, 2, c_gold);
          for (int s = 0; s < 6; s++) {
            float sa = wrot + s * 1.0472f;
            it.line(wlx+(int)(cosf(sa)*2.f), wly+(int)(sinf(sa)*2.f),
                    wlx+(int)(cosf(sa)*9.f), wly+(int)(sinf(sa)*9.f), c_spk);
          }
          int wrx = dhx + 18;
          it.circle(wrx, wly, 10, c_gold);
          it.filled_circle(wrx, wly, 2, c_gold);
          for (int s = 0; s < 6; s++) {
            float sa = wrot + s * 1.0472f;
            it.line(wrx+(int)(cosf(sa)*2.f), wly+(int)(sinf(sa)*2.f),
                    wrx+(int)(cosf(sa)*9.f), wly+(int)(sinf(sa)*9.f), c_spk);
          }

          // ── Horses: two cream steeds ahead (to the right, correct direction)
          for (int h = 0; h < 2; h++) {
            int hbx = dhx + 32;
            int hby = cby + (h == 0 ? -8 : 6);
            // Body
            it.filled_rectangle(hbx, hby, 26, 10, c_hrse);
            it.line(hbx+2, hby+10, hbx+24, hby+10, Color(198,182,152)); // belly
            // Arched neck (stacked circles for curve)
            it.filled_circle(hbx+24, hby+3, 6, c_hrse);
            it.filled_circle(hbx+29, hby-2, 5, c_hrse);
            // Head
            it.filled_circle(hbx+34, hby-6, 5, c_hrse);
            // Eye + nostril
            it.filled_circle(hbx+36, hby-8, 1, c_eye);
            it.filled_circle(hbx+37, hby-4, 1, Color(198,172,138));
            // Golden mane (cascading blobs along neck)
            it.filled_circle(hbx+24, hby-1, 4, c_mane);
            it.filled_circle(hbx+27, hby-5, 3, c_mane);
            it.filled_circle(hbx+30, hby-7, 2, c_mane);
            // Running legs (front pair forward, rear pair back)
            int ly = hby + 10;
            it.line(hbx+5,  ly, hbx+3,  ly+16, Color(188,162,118));
            it.line(hbx+10, ly, hbx+9,  ly+16, Color(188,162,118));
            it.line(hbx+16, ly, hbx+18, ly+16, Color(188,162,118));
            it.line(hbx+21, ly, hbx+23, ly+16, Color(188,162,118));
            // Rein from chariot right edge to horse left side
            it.line(cbx+43, cby+5, hbx, hby+4, c_rein);
          }
        }

        // ── RAIN: diagonal drops + lightning strike on Helios ────────────
        if (wm == 1) {
          int xs[10]={id(drop_x1),id(drop_x2),id(drop_x3),id(drop_x4),id(drop_x5),
                      id(drop_x6),id(drop_x7),id(drop_x8),id(drop_x9),id(drop_x10)};
          int ys[10]={id(drop_y1),id(drop_y2),id(drop_y3),id(drop_y4),id(drop_y5),
                      id(drop_y6),id(drop_y7),id(drop_y8),id(drop_y9),id(drop_y10)};
          int sp[10]={3,4,5,3,4,6,3,5,4,6};

          for (int i=0;i<10;i++)
            it.line(xs[i], ys[i], xs[i]-3, ys[i]+8, Color(100,140,200));
          for (int i=0;i<10;i++) {
            ys[i]+=sp[i];
            if(ys[i]>240){ys[i]=0; xs[i]=random(0,240);}
          }
          id(drop_x1)=xs[0];id(drop_y1)=ys[0]; id(drop_x2)=xs[1];id(drop_y2)=ys[1];
          id(drop_x3)=xs[2];id(drop_y3)=ys[2]; id(drop_x4)=xs[3];id(drop_y4)=ys[3];
          id(drop_x5)=xs[4];id(drop_y5)=ys[4]; id(drop_x6)=xs[5];id(drop_y6)=ys[5];
          id(drop_x7)=xs[6];id(drop_y7)=ys[6]; id(drop_x8)=xs[7];id(drop_y8)=ys[7];
          id(drop_x9)=xs[8];id(drop_y9)=ys[8]; id(drop_x10)=xs[9];id(drop_y10)=ys[9];

          // Lightning: random bolt near Helios, flashes for ~10 frames
          id(lightning_timer) -= 1;
          if (id(lightning_timer) <= 0 && helios_on_screen && random(0,80)==0) {
            id(lightning_timer) = 10;
            id(lightning_x) = dhx + random(-25, 25);
          }
          if (id(lightning_timer) > 0) {
            int lx = id(lightning_x), ly = dhy - 18;
            it.line(lx,   ly,   lx+5, ly+13, Color(255,255,100));
            it.line(lx+5, ly+13,lx-3, ly+25, Color(255,255,100));
            it.line(lx-3, ly+25,lx+7, ly+40, Color(255,255,100));
            // Flash halo around Helios on first few frames
            if (id(lightning_timer) > 7)
              it.circle(dhx, dhy, 27, Color(255,255,180));
          }
        }

        // ── CLOUDY: two cloud layers drifting at different speeds ─────────
        if (wm == 2) {
          int c1x = (f / 4) % 320 - 60;
          int c2x = (f / 7 + 160) % 320 - 60;
          // Foreground cloud (darker)
          it.filled_circle(c1x,    50, 22, Color(130,135,148));
          it.filled_circle(c1x+25, 38, 28, Color(130,135,148));
          it.filled_circle(c1x+55, 50, 22, Color(130,135,148));
          // Background cloud (lighter)
          it.filled_circle(c2x,    82, 18, Color(155,158,168));
          it.filled_circle(c2x+22, 70, 24, Color(155,158,168));
          it.filled_circle(c2x+48, 82, 18, Color(155,158,168));
        }

        // ── WINDY: horizontal gusts scrolling across screen ───────────────
        if (wm == 3) {
          for (int w = 0; w < 6; w++) {
            int wy   = 12 + w * 35;
            int wx   = (f * (3+w) + w*70) % 340 - 40;
            int wlen = 22 + w * 10;
            it.line(wx, wy, wx+wlen, wy, Color(200,225,245));
            if (wlen > 28)
              it.line(wx+4, wy+2, wx+wlen-8, wy+2, Color(175,208,235));
          }
        }
      }

      // ── Clock (always on top, every mode) ───────────────────────────────
      auto now = id(ntp_time).now();
      if (now.is_valid()) {
        char hour_str[4], min_str[4];
        snprintf(hour_str, sizeof(hour_str), "%02d", now.hour);
        snprintf(min_str,  sizeof(min_str),  "%02d", now.minute);
        int cx  = 120 + id(x_shift);
        int cy1 =  70 + id(y_shift);
        int cy2 = 170 + id(y_shift);

        it.printf(cx, cy1, id(clock_font), Color::WHITE, TextAlign::CENTER, "%s", hour_str);
        it.line(40+id(x_shift), 120+id(y_shift), 200+id(x_shift), 120+id(y_shift), Color(80,80,80));
        it.printf(cx, cy2, id(clock_font), Color::WHITE, TextAlign::CENTER, "%s", min_str);
      }
